<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Face Reader: Emotion Recognition Game | Dr. Nancy J Fernandez</title>
<style>
:root{--bg:#f4f1fb;--card:#fff;--tx:#1f1b33;--mut:#6a6585;--pri:#5b3fd9;--ok:#0f9d68;--bad:#d93a40;--gold:#f2a900;--bd:#ddd6f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112c;--card:#211c45;--tx:#f1eeff;--mut:#aaa4d2;--pri:#a28cff;--ok:#38d39f;--bad:#ff6b70;--gold:#ffd04a;--bd:#38326a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15112c;--card:#211c45;--tx:#f1eeff;--mut:#aaa4d2;--pri:#a28cff;--ok:#38d39f;--bad:#ff6b70;--gold:#ffd04a;--bd:#38326a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,"Times New Roman",serif}
h1,h2,.pill,button,.meta{font-family:system-ui,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px}
h1{font-size:clamp(2rem,8vw,3rem);line-height:1.05;margin:.2em 0}
h2{font-size:1.15rem;margin:.6em 0;text-align:center}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:4px 12px;font-weight:700;font-size:.95rem}
.hud button{margin-left:auto;background:none;border:1px solid var(--bd);border-radius:99px;padding:4px 10px;color:inherit;cursor:pointer}
.meta{color:var(--mut);font-size:.85rem;text-align:center;min-height:1.3em}
.face svg{display:block;width:100%;max-width:230px;margin:8px auto;transition:filter .4s}
.face.blur svg{filter:blur(16px)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--pri)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt,.go{font:600 1rem system-ui,sans-serif;padding:14px 8px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt:focus-visible,.go:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled:not(.ok):not(.no){opacity:.55}
.go{background:var(--pri);border-color:var(--pri);color:#fff;width:100%;margin-top:12px;font-size:1.05rem}
.res{font:700 1rem system-ui,sans-serif;padding:10px 12px;border-radius:12px;margin-top:14px}
.res.good{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.res.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.note{font-size:.95rem;margin-top:10px;padding:10px 12px;border-left:4px solid var(--pri);background:var(--bg);border-radius:6px}
.mut{color:var(--mut)}
ul{padding-left:1.2em}
.big{font:800 3rem system-ui,sans-serif;color:var(--gold);text-align:center;margin:0}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#fl{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(transparent 35%,var(--bad))}
#fl.on{animation:fl .55s}
@keyframes fl{0%{opacity:.75}100%{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#fx span{position:fixed;top:-40px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(var(--r))}}
.pop{position:fixed;left:50%;top:38%;font:800 3rem system-ui,sans-serif;color:var(--gold);transform:translateX(-50%);animation:rise 1s forwards;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.pop.bad{color:var(--bad)}
@keyframes rise{to{transform:translate(-50%,-90px);opacity:0}}
@media(prefers-reduced-motion:reduce){#fx span,.shake,.pop{animation-duration:.01s}}
.scene{position:relative;border-radius:16px;padding:6px 6px 0;background:linear-gradient(160deg,var(--s1),var(--s2));overflow:hidden}
.prop{position:absolute;top:8px;right:12px;font-size:2.4rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.sit{font:500 .92rem/1.35 system-ui,sans-serif;background:color-mix(in srgb,var(--card) 90%,transparent);border-radius:10px;padding:8px 10px;margin:4px 2px 8px}
.brand{display:flex;gap:14px;align-items:center}.brand img,.foot img{background:#fff;border-radius:10px;padding:3px}.brand img{width:76px}
.brand b{font:700 1.02rem system-ui,sans-serif;display:block}.brand span{color:var(--mut);font:.9rem system-ui,sans-serif}
.foot{display:flex;gap:10px;align-items:center;justify-content:center;margin:14px 0 4px;font:.8rem/1.3 system-ui,sans-serif;color:var(--mut);text-align:center}.foot img{width:34px}
.lvl{font:800 1.3rem system-ui,sans-serif;text-align:center;border:3px solid;border-radius:14px;padding:10px;margin:8px 0}
</style></head><body>
<div id="app"></div><div id="fl"></div><div id="fx"></div>

$("#fb").innerHTML=`${msg}<div class="note"><b>${d.n}</b>: ${d.au}.<br>${d.note}</div><button class="go" onclick="${over?"end()":"nx()"}">${over?"See results":"Next face"}</button>`;
hud();$("#fb").scrollIntoView({behavior:"smooth",block:"nearest"})}
function nx(){G.i++;play()}
function end(){const n=G.i+1,acc=G.ok/n,dead=G.lv<=0;let b=0;try{b=+localStorage.getItem("fr-best")||0;if(G.sc>b){localStorage.setItem("fr-best",G.sc)}}catch(e){}
const rank=acc>=.9?"🏆 Empathy Expert":acc>=.7?"🥇 Emotion Reader":acc>=.5?"🥈 Apprentice Observer":"🌱 Novice: keep practising";
const miss=[...new Set(G.miss)],L=G.sc>=110?{n:"High",c:"var(--ok)",d:"You read facial expressions and situations accurately, even under time pressure."}:G.sc>=60?{n:"Average",c:"var(--gold)",d:"You recognise common emotions but still confuse similar ones, such as fear and surprise."}:{n:"Low",c:"var(--bad)",d:"You often misread expressions. Review the notes below and try again."};if(!dead)confetti(60);
$("#app").innerHTML=`<div class="wrap"><div class="card"><div class="meta">${dead?"Out of lives":"All faces done"}</div><p class="big">${G.sc}</p><div class="lvl" style="border-color:${L.c};color:${L.c}">${L.n} emotion recognition level</div><p style="text-align:center">${L.d}</p><h2>${rank}</h2>
<p style="text-align:center">${G.ok} of ${n} correct (${Math.round(acc*100)}%) · 💎 ${G.gem} gems · ${G.sc>b?"New best score!":"Best: "+b}</p>
${miss.length?`<h2>Review the ones you missed</h2>${miss.map(k=>`<div class="note"><b>${D[k].n}</b>: ${D[k].au}.<br>${D[k].note}</div>`).join("")}`:`<div class="res good">Flawless: you missed no expressions.</div>`}
<p class="mut" style="font:.82rem/1.4 system-ui,sans-serif">Score bands: High 110 and above, Average 60 to 109, Low below 60. This is a classroom learning game, not a standardised or clinical test of emotional intelligence.</p><button class="go" onclick="start()">Play again</button></div>${foot()}</div>`}
home();
